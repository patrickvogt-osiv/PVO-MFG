[build]
  command = "npm run build"
  publish = "dist"

# VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY und VITE_ADMIN_EMAIL sind bewusst
# öffentliche, client-seitige Werte (Supabase sichert den Zugriff über Row
# Level Security in der Datenbank ab, nicht über Geheimhaltung des anon-Keys;
# die Admin-E-Mail wird im Browser für den mailto-Link gebraucht). Sie müssen
# im Frontend-Bundle landen, damit die App funktioniert — deshalb hier
# explizit von Netlifys Secret-Scanner ausgenommen.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_ADMIN_EMAIL"

# Client-seitiges Routing (React Router): alle Pfade auf index.html umleiten,
# damit z.B. /invite/TOKEN oder /admin auch bei direktem Aufruf/Reload
# funktionieren statt eines 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hinweis: Netlify hat zusätzlich ein neueres "Secret scanning with smart
# detection"-Feature (auf bezahlten Plänen automatisch aktiv), das UNABHÄNGIG
# von SECRETS_SCAN_OMIT_KEYS oben läuft und bei denselben drei Werten erneut
# anschlagen kann. Falls das passiert: im Netlify-Dashboard unter
# Project configuration → Environment variables eine Variable
# SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES anlegen und dort die drei
# tatsächlichen Werte (nicht die Variablennamen!) kommagetrennt eintragen.
# Diese Werte gehören NICHT in diese Datei, da sie pro Deployment
# unterschiedlich sind und diese Datei versioniert wird.
